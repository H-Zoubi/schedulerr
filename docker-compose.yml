services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: schedulerr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to the existing database password or a strong password for a new database}
      POSTGRES_DB: schedulerr
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the API container talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulerr -d schedulerr"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://schedulerr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/schedulerr
      # Origins allowed to make changes. Add your Cloudflare Tunnel address here.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # The timezone the app's times are in. Reminders are compared against this.
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      AI_API_USER_ID: ${AI_API_USER_ID:-}
      AI_API_READ_KEY_HASH: ${AI_API_READ_KEY_HASH:-}
      AI_API_WRITE_KEY_HASH: ${AI_API_WRITE_KEY_HASH:-}
      # Push notifications. Set NTFY_TOPIC and/or GOTIFY_URL with GOTIFY_TOKEN.
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      GOTIFY_URL: ${GOTIFY_URL:-}
      GOTIFY_TOKEN: ${GOTIFY_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nightly database dump into ./backups, keeping the newest BACKUP_KEEP files.
  backup:
    image: postgres:16
    environment:
      PGHOST: db
      PGUSER: schedulerr
      PGDATABASE: schedulerr
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          file=/backups/schedulerr-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump --format=custom --file="$$file.tmp"; then
            mv "$$file.tmp" "$$file" && echo "Backed up to $$file"
          else
            rm -f "$$file.tmp"; echo "Backup failed" >&2
          fi
          ls -1t /backups/schedulerr-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep "$$BACKUP_EVERY_SECONDS"
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      # Localhost only by default. If the Cloudflare Tunnel runs on another host
      # (e.g. another LXC), set WEB_BIND to this host's LAN IP in .env.
      - "${WEB_BIND:-127.0.0.1}:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
