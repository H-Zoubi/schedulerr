services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: schedulerr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schedulerr}
      POSTGRES_DB: schedulerr
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the API container talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulerr -d schedulerr"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://schedulerr:${POSTGRES_PASSWORD:-schedulerr}@db:5432/schedulerr
      # Origins allowed to make changes. Add your Cloudflare Tunnel address here.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # The timezone the app's times are in. Reminders are compared against this.
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      # Push notifications. Set NTFY_TOPIC and/or GOTIFY_URL with GOTIFY_TOKEN.
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      GOTIFY_URL: ${GOTIFY_URL:-}
      GOTIFY_TOKEN: ${GOTIFY_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
